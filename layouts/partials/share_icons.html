{{/* PaperMod 의 공유 아이콘 묶음을 링크 복사 버튼 하나로 대체한다.
     SNS 아이콘을 늘어놓아도 실제로 눌리는 건 링크 복사뿐이고,
     주소창을 긁어 복사하는 것보다 버튼 하나가 빠르다.

     같은 버튼이 제목 아래(post_meta.html)에도 있다. 스크립트는 여기 한 번만 두고
     .copy-btn 전부를 잡는다. 두 군데에 넣으면 핸들러가 두 번 붙는다. */}}
<div class="copy-link">
  <button type="button" class="copy-btn" data-url="{{ .Permalink }}">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
    </svg>
    <span class="copy-label">링크 복사</span>
  </button>
</div>

<style>
.copy-link{margin:28px 0 8px}
.copy-link .copy-btn{
  padding:9px 16px;min-height:38px;font-size:14px;
  background:var(--code-bg);border-radius:8px;
}
.copy-link .copy-btn .copy-label{display:inline}
</style>

<script>
(function () {
  var btns = document.querySelectorAll(".copy-btn");
  if (!btns.length) return;

  function flash(btn, text) {
    var label = btn.querySelector(".copy-label");
    var original = label.dataset.orig || label.textContent;
    label.dataset.orig = original;
    label.textContent = text;
    btn.classList.add("done");
    setTimeout(function () {
      label.textContent = original;
      btn.classList.remove("done");
    }, 1800);
  }

  function fallback(btn, url) {
    var ta = document.createElement("textarea");
    ta.value = url;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      flash(btn, document.execCommand("copy") ? "복사됨" : "복사 실패");
    } catch (e) {
      flash(btn, "복사 실패");
    }
    document.body.removeChild(ta);
  }

  // 공유 시트가 열리는 기기에서는 복사가 아니라 보내기가 맞다.
  // 복사만 되면 카톡으로 넘기는 데 앱 전환과 붙여넣기가 더 필요하다.
  var canShare = !!navigator.share;
  if (canShare) {
    Array.prototype.forEach.call(btns, function (btn) {
      var label = btn.querySelector(".copy-label");
      if (label) label.textContent = "공유";
      if (btn.hasAttribute("aria-label")) btn.setAttribute("aria-label", "공유");
    });
  }

  Array.prototype.forEach.call(btns, function (btn) {
    btn.addEventListener("click", function () {
      var url = btn.dataset.url;
      if (canShare) {
        // 취소도 reject 로 온다. 사용자가 그만둔 것이므로 아무 말 없이 넘어간다.
        navigator.share({ title: document.title, url: url }).catch(function () {});
        return;
      }
      // clipboard API 는 https 와 사용자 제스처가 필요하다. 안 되면 옛 방식으로 떨어진다.
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(
          function () { flash(btn, "복사됨"); },
          function () { fallback(btn, url); }
        );
      } else {
        fallback(btn, url);
      }
    });
  });
})();
</script>
