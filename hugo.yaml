baseURL: https://travel.importants-studio.com/
locale: ko-kr
defaultContentLanguage: ko
title: 여행의밑줄
theme: PaperMod

enableRobotsTXT: true
enableGitInfo: true

services:
  googleAnalytics:
    ID: G-LWNSV20YQR

buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true
  tdewolff:
    html:
      # 속성값 따옴표를 벗기면 name=msvalidate.01 처럼 점이 든 값을
      # 빙 소유확인 파서가 못 읽는다. 따옴표를 남긴다.
      keepQuotes: true

outputFormats:
  EMBED:
    mediaType: text/html
    baseName: embed
    isHTML: true
    notAlternative: true
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - LLMS

params:
  env: production
  author: Importants Studio
  title: 여행의밑줄
  description: "떠나기 전 챙길 절차와 돈. 여권, 환전, 로밍, 보험, 면세."
  keywords: [국민연금, 퇴직연금, 연금저축, 주택연금, 건강보험료, 노후준비, 중장년재취업, 기초연금]
  defaultTheme: auto
  assets:
    favicon: /favicon-32x32.png
    apple_touch_icon: /apple-touch-icon.png
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: false
  ShowToc: true
  TocOpen: false
  ShowShareButtons: true
  disableSpecial1stPost: true
  hideSummary: false

  homeInfoParams:
    Title: 여행의밑줄
    Content: 은퇴가 다가오면 모르는 것이 한꺼번에 몰려옵니다. 연금은 언제부터 나오는지, 건강보험료는 어떻게 바뀌는지, 퇴직금은 어디에 두는지. 하나씩 공식 자료를 찾아 정리합니다.

menu:
  main:
    - identifier: posts
      name: 전체 글
      url: /posts/
      weight: 10
    - identifier: tools
      name: 도구
      url: /tools/
      weight: 15
    - identifier: tags
      name: 태그
      url: /tags/
      weight: 20
    - identifier: search
      name: 검색
      url: /search/
      weight: 30
    - identifier: about
      name: 소개
      url: /about/
      weight: 40
    - identifier: contact
      name: 문의
      url: /contact/
      weight: 45
    - identifier: privacy
      name: 개인정보처리방침
      url: /privacy/
      weight: 50

# 태그 페이지는 검색에서 뺀다.
#
# 글 232편에 태그 페이지가 693개고 그중 563개는 글이 한 편만 달려 있다. 그런 페이지의
# 본문은 그 글의 요약문 300~500자가 전부라, 한 글에 태그를 다섯 개 달면 같은 글자가
# 다섯 주소에 들어간다. 애드센스가 "가치가 별로 없는 콘텐츠" 로 막은 상태라 이런 페이지가
# 색인되면 불리하다.
#
# 잃는 것은 거의 없다. 2026-09 기준 28일 검색 노출 942회 중 태그·카테고리 몫이 3회였다.
# 카테고리는 네댓 개뿐이고 글이 여러 편씩 달려 있어 그대로 둔다.
# 페이지 자체는 남으므로 독자가 태그를 눌러 들어오는 길은 그대로다.
cascade:
  - _target:
      path: /tags/**
    robotsNoIndex: true
  - _target:
      kind: taxonomy
      path: /tags
    robotsNoIndex: true
markup:
  goldmark:
    extensions:
      # 한글 물결표 범위(60~65세)를 취소선으로 먹어버려서 끈다.
      strikethrough: false
    renderer:
      unsafe: false
  highlight:
    noClasses: false
